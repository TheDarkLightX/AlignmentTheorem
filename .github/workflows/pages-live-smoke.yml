name: Verify live GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ROOT: https://thedarklightx.github.io/AlignmentTheorem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Poll Pages and bind every public artifact to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live qa
          ready=0
          matches_main() {
            cmp -s docs/index.html live/index.html \
              && cmp -s docs/data-center-social-contract.html live/data.html \
              && cmp -s docs/alignment-theorem-deep-dive.html live/deep.html \
              && cmp -s docs/v1-1-hyperdeflationary-alignment.html live/v11.html \
              && cmp -s docs/local-government-policy-playbook.html live/playbook.html \
              && cmp -s docs/current-tau-net-integration.html live/current.html \
              && cmp -s docs/intelligence-hyperdeflation-flywheel.html live/flywheel.html \
              && cmp -s docs/alignment-theorem-v1-archive-notice.html live/v1.html \
              && cmp -s docs/Alignment_Theorem_V1_Original_2025.pdf live/v1-original.pdf \
              && cmp -s docs/Alignment_Theorem_Academic.pdf live/v1-boundary.pdf \
              && cmp -s docs/Alignment_Theorem_V1_1_Hyperdeflationary.pdf live/v1-1.pdf \
              && cmp -s docs/Alignment_Theorem_V2.pdf live/v2.pdf
          }
          for attempt in $(seq 1 60); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            home=$(curl -L -sS -o live/index.html -w "%{http_code}" "${SITE_ROOT}/?verify=${nonce}" || true)
            data=$(curl -L -sS -o live/data.html -w "%{http_code}" "${SITE_ROOT}/data-center-social-contract.html?verify=${nonce}" || true)
            deep=$(curl -L -sS -o live/deep.html -w "%{http_code}" "${SITE_ROOT}/alignment-theorem-deep-dive.html?verify=${nonce}" || true)
            v11=$(curl -L -sS -o live/v11.html -w "%{http_code}" "${SITE_ROOT}/v1-1-hyperdeflationary-alignment.html?verify=${nonce}" || true)
            playbook=$(curl -L -sS -o live/playbook.html -w "%{http_code}" "${SITE_ROOT}/local-government-policy-playbook.html?verify=${nonce}" || true)
            current=$(curl -L -sS -o live/current.html -w "%{http_code}" "${SITE_ROOT}/current-tau-net-integration.html?verify=${nonce}" || true)
            flywheel=$(curl -L -sS -o live/flywheel.html -w "%{http_code}" "${SITE_ROOT}/intelligence-hyperdeflation-flywheel.html?verify=${nonce}" || true)
            v1=$(curl -L -sS -o live/v1.html -w "%{http_code}" "${SITE_ROOT}/alignment-theorem-v1-archive-notice.html?verify=${nonce}" || true)
            original=$(curl -L -sS -o live/v1-original.pdf -w "%{http_code}" "${SITE_ROOT}/Alignment_Theorem_V1_Original_2025.pdf?verify=${nonce}" || true)
            v1_pdf=$(curl -L -sS -o live/v1-boundary.pdf -w "%{http_code}" "${SITE_ROOT}/Alignment_Theorem_Academic.pdf?verify=${nonce}" || true)
            v11_pdf=$(curl -L -sS -o live/v1-1.pdf -w "%{http_code}" "${SITE_ROOT}/Alignment_Theorem_V1_1_Hyperdeflationary.pdf?verify=${nonce}" || true)
            v2_pdf=$(curl -L -sS -o live/v2.pdf -w "%{http_code}" "${SITE_ROOT}/Alignment_Theorem_V2.pdf?verify=${nonce}" || true)
            if [[ "$home" == 200 && "$data" == 200 && "$deep" == 200 && "$v11" == 200 \
              && "$playbook" == 200 && "$current" == 200 && "$flywheel" == 200 \
              && "$v1" == 200 && "$original" == 200 && "$v1_pdf" == 200 \
              && "$v11_pdf" == 200 && "$v2_pdf" == 200 ]] \
              && grep -q "The Data Center Bargain" live/index.html \
              && grep -q "The Data Center Bargain | Alignment Theorem" live/data.html \
              && grep -q "Making Ethics Profitable" live/deep.html \
              && grep -q "Ethical Work Under Hyperdeflation" live/v11.html \
              && grep -q "Make growth pay for growth" live/playbook.html \
              && grep -q "Three profiles" live/current.html \
              && grep -q "intelligence dividend" live/flywheel.html \
              && grep -q "V1 mechanism remains" live/v1.html \
              && matches_main; then
              printf '{"home":%s,"data_center":%s,"deep_dive":%s,"v1_1":%s,"playbook":%s,"current_tau":%s,"flywheel":%s,"v1_boundary":%s,"v1_original_pdf":%s,"v1_boundary_pdf":%s,"v1_1_pdf":%s,"v2_pdf":%s,"attempt":%s}\n' \
                "$home" "$data" "$deep" "$v11" "$playbook" "$current" "$flywheel" "$v1" "$original" "$v1_pdf" "$v11_pdf" "$v2_pdf" "$attempt" > live/http-status.json
              ready=1
              break
            fi
            echo "Waiting for Pages: home=${home} data=${data} deep=${deep} v1.1=${v11} playbook=${playbook} current=${current} flywheel=${flywheel} v1=${v1} original=${original} v1_pdf=${v1_pdf} v1.1_pdf=${v11_pdf} v2_pdf=${v2_pdf} attempt=${attempt}"
            sleep 10
          done
          test "$ready" -eq 1
          cmp docs/index.html live/index.html
          cmp docs/data-center-social-contract.html live/data.html
          cmp docs/alignment-theorem-deep-dive.html live/deep.html
          cmp docs/v1-1-hyperdeflationary-alignment.html live/v11.html
          cmp docs/local-government-policy-playbook.html live/playbook.html
          cmp docs/current-tau-net-integration.html live/current.html
          cmp docs/intelligence-hyperdeflation-flywheel.html live/flywheel.html
          cmp docs/alignment-theorem-v1-archive-notice.html live/v1.html
          cmp docs/Alignment_Theorem_V1_Original_2025.pdf live/v1-original.pdf
          cmp docs/Alignment_Theorem_Academic.pdf live/v1-boundary.pdf
          cmp docs/Alignment_Theorem_V1_1_Hyperdeflationary.pdf live/v1-1.pdf
          cmp docs/Alignment_Theorem_V2.pdf live/v2.pdf

      - name: Install browser verifier
        run: |
          python3 -m pip install --disable-pip-version-check selenium==4.35.0
          (google-chrome --version || chromium --version || chromium-browser --version)

      - name: Test every deployed HTML page responsively
        env:
          VERIFY_NONCE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          site = os.environ["SITE_ROOT"].rstrip("/")
          nonce = os.environ["VERIFY_NONCE"]
          chrome = shutil.which("google-chrome") or shutil.which("chromium") or shutil.which("chromium-browser")
          if not chrome:
              raise RuntimeError("Chrome/Chromium is unavailable")
          options = Options()
          options.binary_location = chrome
          for arg in ("--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--force-device-scale-factor=1"):
              options.add_argument(arg)
          driver_path = shutil.which("chromedriver")
          driver = webdriver.Chrome(service=Service(driver_path) if driver_path else Service(), options=options)
          wait = WebDriverWait(driver, 30)
          Path("qa").mkdir(exist_ok=True)

          public_pages = [
              ("home", f"{site}/?browser={nonce}", "Alignment Theorem - Ethical and Profitable LLM Agents", f"{site}/", "The Data Center Bargain"),
              ("data-center", f"{site}/data-center-social-contract.html?browser={nonce}", "The Data Center Bargain | Alignment Theorem", f"{site}/data-center-social-contract.html", "The Data Center Bargain"),
              ("deep-dive", f"{site}/alignment-theorem-deep-dive.html?browser={nonce}", "The Alignment Theorem | Making Ethics Profitable", f"{site}/alignment-theorem-deep-dive.html", "EETF-Gated Scarcity-Upside Exclusion Theorem"),
              ("v1-1", f"{site}/v1-1-hyperdeflationary-alignment.html?browser={nonce}", "Ethical Work Under Hyperdeflation: Alignment Theorem V1.1", f"{site}/v1-1-hyperdeflationary-alignment.html", "Ethical Work Under Hyperdeflation"),
              ("playbook", f"{site}/local-government-policy-playbook.html?browser={nonce}", "Local Data-Center Policy Playbook | Alignment Theorem", f"{site}/local-government-policy-playbook.html", "The fourteen-part local package"),
              ("current-tau", f"{site}/current-tau-net-integration.html?browser={nonce}", "Three Alignment Profiles on Current Tau | Alignment Theorem", f"{site}/current-tau-net-integration.html", "27 / 27"),
              ("flywheel", f"{site}/intelligence-hyperdeflation-flywheel.html?browser={nonce}", "The Intelligence Dividend | Alignment Theorem × Tau Net", f"{site}/intelligence-hyperdeflation-flywheel.html", "not yet a node deployment"),
              ("v1-boundary", f"{site}/alignment-theorem-v1-archive-notice.html?browser={nonce}", "Alignment Theorem Version 1 Claim Boundary", f"{site}/alignment-theorem-v1-archive-notice.html", "The V1 mechanism remains"),
          ]
          viewports = [("desktop", 1440, 1000), ("tablet", 768, 1024), ("mobile", 390, 844)]
          report = {"schema": "alignment-theorem-live-browser-report-v3", "browser": driver.capabilities.get("browserVersion"), "public_pages": [], "interactions": {}}

          audit = """
          const controls=[...document.querySelectorAll('input,select,textarea,button')];
          const unlabeled=controls.filter(el=>{
            if(el.tagName==='BUTTON') return !(el.textContent.trim()||el.getAttribute('aria-label')||el.getAttribute('aria-labelledby'));
            if(el.type==='hidden') return false;
            return !(el.getAttribute('aria-label')||el.getAttribute('aria-labelledby')||el.closest('label')||(el.id&&document.querySelector(`label[for="${CSS.escape(el.id)}"]`)));
          }).map(el=>el.id||el.tagName);
          const ids=[...document.querySelectorAll('[id]')].map(el=>el.id);
          const duplicateIds=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))];
          const emptyLinks=[...document.querySelectorAll('a')].filter(a=>!a.getAttribute('href')||a.getAttribute('href')==='#').length;
          const featureBranchLinks=[...document.querySelectorAll('a[href]')].filter(a=>a.href.includes('research/compute-dividend-wealth-agent')).length;
          return {title:document.title, canonical:document.querySelector('link[rel="canonical"]')?.href||null, innerWidth, documentWidth:document.documentElement.scrollWidth, bodyWidth:document.body.scrollWidth, mainCount:document.querySelectorAll('main').length, navCount:document.querySelectorAll('nav').length, unlabeled, duplicateIds, emptyLinks, featureBranchLinks, bodyText:document.body.innerText};
          """

          try:
              for viewport, width, height in viewports:
                  driver.set_window_size(width, height)
                  for name, url, title, canonical, marker in public_pages:
                      driver.get(url)
                      wait.until(lambda d: d.execute_script("return document.readyState") == "complete")
                      wait.until(lambda d: marker in d.find_element(By.TAG_NAME, "body").text)
                      time.sleep(.3)
                      m = driver.execute_script(audit)
                      assert m["title"] == title, (name, m["title"])
                      assert m["canonical"] == canonical, (name, m["canonical"])
                      assert m["documentWidth"] <= m["innerWidth"] + 2, (name, viewport, m)
                      assert m["bodyWidth"] <= m["innerWidth"] + 2, (name, viewport, m)
                      assert m["mainCount"] == 1, (name, "main", m)
                      assert not m["unlabeled"], (name, "labels", m)
                      assert not m["duplicateIds"], (name, "ids", m)
                      assert m["emptyLinks"] == 0 and m["featureBranchLinks"] == 0, (name, "links", m)
                      shot = f"qa/{name}-{viewport}.png"
                      driver.save_screenshot(shot)
                      report["public_pages"].append({"page": name, "viewport": viewport, "width": width, "document_width": m["documentWidth"], "main_count": m["mainCount"], "nav_count": m["navCount"], "screenshot": shot})

              driver.set_window_size(1440, 1000)
              driver.get(public_pages[0][1])
              accelerated = wait.until(lambda d: d.find_element(By.CSS_SELECTOR, '.scenario-button[data-scarcity="60"]'))
              driver.execute_script("arguments[0].scrollIntoView({block:'center'}); arguments[0].click();", accelerated)
              wait.until(lambda d: d.find_element(By.ID, "scarcityValue").text == "60x")
              assert accelerated.get_attribute("aria-pressed") == "true"
              report["interactions"]["homepage_scenario"] = {"scarcity": driver.find_element(By.ID, "scarcityValue").text, "aria_pressed": accelerated.get_attribute("aria-pressed")}

              driver.get(public_pages[1][1])
              wait.until(lambda d: d.execute_script("return document.readyState") == "complete")
              driver.execute_script("""
                const values={gross:'10',costs:'9',floor:'2',deficits:'0, 5',compute:'1',computeFloor:'2'};
                for(const [id,value] of Object.entries(values)){const el=document.getElementById(id);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));}
              """)
              wait.until(lambda d: "Unfunded" in d.find_element(By.ID, "rCashStatus").text)
              wait.until(lambda d: "Unfunded" in d.find_element(By.ID, "rComputeStatus").text)
              report["interactions"]["community_calculator"] = {"cash": driver.find_element(By.ID, "rCashStatus").text, "compute": driver.find_element(By.ID, "rComputeStatus").text, "required": driver.find_element(By.ID, "rRequired").text}
          finally:
              driver.quit()
          Path("qa/live-browser-report.json").write_text(json.dumps(report, indent=2, sort_keys=True)+"\n")
          PY

      - name: Write live deployment receipt
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt, hashlib, json, os
          from pathlib import Path
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          mapping = {
            "homepage": ("docs/index.html", "live/index.html", os.environ["SITE_ROOT"]+"/"),
            "data_center_social_contract": ("docs/data-center-social-contract.html", "live/data.html", os.environ["SITE_ROOT"]+"/data-center-social-contract.html"),
            "v1_deep_dive": ("docs/alignment-theorem-deep-dive.html", "live/deep.html", os.environ["SITE_ROOT"]+"/alignment-theorem-deep-dive.html"),
            "v1_1_hyperdeflationary": ("docs/v1-1-hyperdeflationary-alignment.html", "live/v11.html", os.environ["SITE_ROOT"]+"/v1-1-hyperdeflationary-alignment.html"),
            "local_government_policy_playbook": ("docs/local-government-policy-playbook.html", "live/playbook.html", os.environ["SITE_ROOT"]+"/local-government-policy-playbook.html"),
            "current_tau_integration": ("docs/current-tau-net-integration.html", "live/current.html", os.environ["SITE_ROOT"]+"/current-tau-net-integration.html"),
            "intelligence_flywheel": ("docs/intelligence-hyperdeflation-flywheel.html", "live/flywheel.html", os.environ["SITE_ROOT"]+"/intelligence-hyperdeflation-flywheel.html"),
            "v1_claim_boundary": ("docs/alignment-theorem-v1-archive-notice.html", "live/v1.html", os.environ["SITE_ROOT"]+"/alignment-theorem-v1-archive-notice.html"),
            "v1_original_pdf": ("docs/Alignment_Theorem_V1_Original_2025.pdf", "live/v1-original.pdf", os.environ["SITE_ROOT"]+"/Alignment_Theorem_V1_Original_2025.pdf"),
            "v1_claim_boundary_pdf": ("docs/Alignment_Theorem_Academic.pdf", "live/v1-boundary.pdf", os.environ["SITE_ROOT"]+"/Alignment_Theorem_Academic.pdf"),
            "v1_1_pdf": ("docs/Alignment_Theorem_V1_1_Hyperdeflationary.pdf", "live/v1-1.pdf", os.environ["SITE_ROOT"]+"/Alignment_Theorem_V1_1_Hyperdeflationary.pdf"),
            "v2_pdf": ("docs/Alignment_Theorem_V2.pdf", "live/v2.pdf", os.environ["SITE_ROOT"]+"/Alignment_Theorem_V2.pdf"),
          }
          pages = {}
          for name,(source,live,url) in mapping.items():
            s,l=sha(source),sha(live)
            assert s==l
            pages[name]={"url":url,"source_path":source,"source_sha256":s,"live_body_sha256":l,"exact_body_match":True}
          receipt={
            "schema":"alignment-theorem-github-pages-live-receipt-v3",
            "status":"LIVE_AND_POLISHED",
            "verified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
            "workflow_run":os.environ["RUN_URL"],
            "workflow_source_commit":os.environ["GITHUB_SHA"],
            "docs_source_commit":os.environ["GITHUB_SHA"],
            "http_status":json.loads(Path("live/http-status.json").read_text()),
            "pages":pages,
            "browser_report":json.loads(Path("qa/live-browser-report.json").read_text()),
            "assertions":{"all_http_200":True,"exact_live_bodies_match_main_sources":True,"all_public_html_responsive_at_three_widths":True,"accessible_controls_and_landmarks":True,"no_duplicate_ids_or_stale_branch_links":True,"both_interactions_passed":True,"all_public_pages_live_and_rendered":True,"screenshots_captured":True}
          }
          out=Path("verification/receipts/github_pages_live.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(out.read_text())
          PY

      - name: Upload live QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-live-proof
          path: |
            verification/receipts/github_pages_live.json
            qa/*.json
            qa/*.png
            live/http-status.json
          if-no-files-found: error

      - name: Commit live receipt
        run: |
          git config user.name "TheDarkLightX"
          git config user.email "TheDarkLightX@users.noreply.github.com"
          git add verification/receipts/github_pages_live.json
          git commit -m "verification: record live polished GitHub Pages"
          git push origin HEAD:main
