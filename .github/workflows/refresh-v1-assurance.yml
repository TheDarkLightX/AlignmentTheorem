name: Refresh V1.1 assurance receipt

on:
  push:
    branches:
      - research/compute-dividend-wealth-agent
    paths:
      - ".github/workflows/refresh-v1-assurance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/compute-dividend-wealth-agent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Refresh the exact source-binding fields
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import sys
          from verification.run_v1_1_assurance import (
              BOUND_FILES,
              REPO_ROOT,
              _bundle_sha256,
              _sha256,
          )

          receipt_path = REPO_ROOT / "verification" / "receipts" / "v1_1_assurance.json"
          checker = REPO_ROOT / "verification" / "run_v1_1_assurance.py"
          receipt = json.loads(receipt_path.read_text())
          hashes = {
              relative: _sha256((REPO_ROOT / relative).read_bytes())
              for relative in BOUND_FILES
          }
          receipt["bound_files_sha256"] = hashes
          receipt["source_bundle_sha256"] = _bundle_sha256(hashes)
          receipt["checker_sha256"] = _sha256(checker.read_bytes())
          receipt["python_version"] = sys.version.split()[0]
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          python3 -m unittest tests.test_v1_1_assurance_receipt -v
      - name: Commit refreshed receipt
        run: |
          if git diff --quiet -- verification/receipts/v1_1_assurance.json; then
            echo "Receipt already current."
            exit 0
          fi
          git config user.name "TheDarkLightX"
          git config user.email "TheDarkLightX@users.noreply.github.com"
          git add verification/receipts/v1_1_assurance.json
          git commit -m "verification: refresh V1.1 assurance after Pages polish"
          git push origin HEAD:research/compute-dividend-wealth-agent
