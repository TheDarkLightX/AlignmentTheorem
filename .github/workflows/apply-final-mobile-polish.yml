name: Apply final mobile polish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-final-mobile-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Apply deterministic mobile-width and verifier fixes
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path

          old = '''        @media (max-width: 520px) {
              h1 { font-size: clamp(2.5rem, 15vw, 4.2rem); letter-spacing: 2px; }
              .subtitle { font-size: 1.24rem; }
              .cta-buttons .cta-button { width: min(100%, 300px); text-align: center; }
              .featured-stats { grid-template-columns: 1fr; }
              .featured-essay { padding: 28px 22px; }
              .theorem-box { padding: 28px 20px; }
              .theorem-text { font-size: 1.25rem; }
              .section-title { font-size: 1.65rem; }
          }'''
          new = '''        @media (max-width: 520px) {
              .container { padding-inline: 14px; }
              h1 {
                  max-width: 100%;
                  font-size: clamp(2.15rem, 12.5vw, 3.35rem);
                  letter-spacing: 1px;
                  overflow-wrap: anywhere;
              }
              .subtitle { font-size: 1.24rem; }
              .cta-buttons .cta-button { width: min(100%, 300px); text-align: center; }
              .card-grid,
              .verification-grid,
              .result-display,
              .featured-stats { grid-template-columns: minmax(0, 1fr); }
              .featured-essay,
              .theorem-box,
              .chart-container,
              .pipeline-container,
              .loop-container,
              .proof-container,
              .card,
              .verification-card,
              .pipeline-node,
              .loop-node { min-width: 0; max-width: 100%; }
              .scenario-button,
              .pipeline-node,
              .loop-node { min-width: 0; }
              .featured-essay { padding: 28px 22px; }
              .theorem-box { padding: 28px 20px; }
              .theorem-text { font-size: 1.25rem; }
              .theorem-text,
              .proof-step,
              .featured-equation,
              .section-title,
              code { overflow-wrap: anywhere; word-break: break-word; }
              .section-title { font-size: 1.65rem; }
              footer { padding-inline: 20px; }
          }'''

          for relative in ("docs/index.html", "verification/polish_public_pages.py"):
              path = Path(relative)
              text = path.read_text()
              if new not in text:
                  if old not in text:
                      raise RuntimeError(f"mobile CSS anchor missing in {relative}")
                  text = text.replace(old, new, 1)
                  path.write_text(text)

          for relative in (
              ".github/workflows/pages-live-smoke.yml",
              ".github/workflows/pages-browser-diagnostic.yml",
          ):
              path = Path(relative)
              text = path.read_text()
              text = text.replace(
                  "btn.click()",
                  "driver.execute_script(\"arguments[0].scrollIntoView({block:'center'}); arguments[0].click();\", btn)",
              )
              text = text.replace('"Underfunded"', '"Unfunded"')
              path.write_text(text)

          # The generator must now be a no-op on the polished sources.
          PY
          python3 verification/polish_public_pages.py
          git diff --check
          grep -q 'font-size: clamp(2.15rem, 12.5vw, 3.35rem)' docs/index.html
          grep -q 'arguments\[0\].scrollIntoView' .github/workflows/pages-live-smoke.yml
          grep -q '"Unfunded"' .github/workflows/pages-live-smoke.yml
      - name: Commit final polish
        run: |
          git config user.name "TheDarkLightX"
          git config user.email "TheDarkLightX@users.noreply.github.com"
          git add docs/index.html verification/polish_public_pages.py \
            .github/workflows/pages-live-smoke.yml \
            .github/workflows/pages-browser-diagnostic.yml
          git commit -m "pages: eliminate mobile overflow and harden live checks"
          git push origin HEAD:main
